<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #f0f4f8;
    }
    .weather-box {
      margin-top: 30px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container text-center mt-5">
    <h1 class="mb-4">🌦️ Weather Dashboard</h1>
    <div class="input-group mb-3 w-50 mx-auto">
      <input type="text" id="cityInput" class="form-control" placeholder="Enter city name"/>
      <button class="btn btn-primary" onclick="getWeather()">Get Weather</button>
    </div>

    <div class="card weather-box p-4 mx-auto shadow" style="width: 22rem;">
      <h3 id="cityName"></h3>
      <p id="weatherDesc"></p>
      <h2 id="temp"></h2>
      <p><strong>Humidity:</strong> <span id="humidity"></span>%</p>
      <p><strong>Wind:</strong> <span id="wind"></span> km/h</p>
    </div>
  </div>

  <script src="new.js"></script>
</body>
</html>
